{% extends "base.html" %}
{% block titulo %}Ingresar · GolStats{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-6 col-lg-4">

    <div class="text-center mb-4">
      <div class="display-5">⚽</div>
      <h1 class="h3 fw-bold text-success">GolStats</h1>
      <p class="text-body-secondary">Sistema de vocalías de fútbol</p>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-4">
        <form method="post" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo</label>
            <input type="email" class="form-control" id="correo" name="correo"
                   value="{{ correo }}" placeholder="usuario@golstats.com" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <button type="submit" class="btn btn-success w-100">Ingresar</button>
        </form>
      </div>
    </div>

    <div class="card mt-3 border-0 bg-transparent">
      <div class="card-body small text-body-secondary">
        <strong>Cuentas de prueba</strong><br>
        Administrador: <code>admin@golstats.com</code> / <code>admin123</code><br>
        Jugador: <code>bryan.vera@golstats.com</code> / <code>jugador123</code>
      </div>
    </div>

  </div>
</div>
{% endblock %}
